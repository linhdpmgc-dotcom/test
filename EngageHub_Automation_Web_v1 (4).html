<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation — Journey Builder · EngageHub</title>
<style>
:root{
 --navy:#16243c;--blue:#0072bc;--blue-d:#005a96;--orange:#f37021;--green:#16a34a;
 --purple:#6b3fd4;--teal:#0e9aa7;--pink:#d81b60;--nbc:#7a5af0;
 --ink:#16243c;--ink-2:#33415a;--muted:#64748b;--muted-2:#94a3b8;
 --line:#e2e8f0;--line2:#eef2f7;--soft:#eaf4fb;--badge:#e8f2fb;--blue-t:#e8f2fb;
 --bg:#f4f6f9;--warn:#c2410c;--amber:#b26a00;
 --shadow:0 1px 3px rgba(16,36,60,.08);--shadow-2:0 10px 30px rgba(16,36,60,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;color:var(--navy)}
a{color:var(--blue);text-decoration:none;cursor:pointer}
.ic-svg{display:inline-block;vertical-align:middle}
/* header */
.hdr{position:sticky;top:0;z-index:40;height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px}
.hdr .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px}
.hdr .logo .mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(120deg,#0072bc,#00a1e0);display:flex;align-items:center;justify-content:center}
.hdr .search{flex:1;max-width:420px;position:relative;color:#9fb0c6}
.hdr .search input{width:100%;height:38px;border-radius:9px;border:1px solid #2a3b56;background:#1e2f49;color:#dfe8f3;padding:0 12px 0 34px;font-size:13px}
.hdr .search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%)}
.hdr .sp{flex:1}
.hdr .av{width:34px;height:34px;border-radius:50%;background:#2a3b56;color:#cdd8e6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.btn{border:0;border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:inherit;white-space:nowrap}
.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:#334155}.btn.ghost:hover{background:#f8fafc}
.btn.pub{background:var(--orange);color:#fff}.btn.pub:hover{filter:brightness(.96)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.ico{padding:8px;width:36px;height:36px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--ink-2)}
.h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.list-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:4px 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center}
/* list toolbar */
.list-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lsearch{position:relative;flex:1;min-width:220px;max-width:340px}
.lsearch input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;font-family:inherit}
.lsearch .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.fchip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#475569;font-family:inherit}
.fchip.on{border-color:var(--blue);background:var(--soft);color:var(--blue)}
.filter-chips{display:flex;gap:8px;flex-wrap:wrap}
/* table */
.ctable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.ctable th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:12px 16px;background:#f7f9fc;border-bottom:1px solid var(--line)}
.ctable td{padding:13px 16px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
.ctable tr:last-child td{border-bottom:0}
.cname{font-weight:700;color:var(--ink);cursor:pointer}
.cname:hover{color:var(--blue)}
.mono{font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px}
.badge.live{background:#dcfce7;color:#166534}
.badge.test{background:#fef3e0;color:#b26a00}
.badge.draft{background:#eef1f6;color:#51607a}
.badge.paused{background:#f1e9fb;color:#6b3fd4}
.badge.neu{background:#eef1f6;color:#51607a}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.live{background:#16a34a}.dot.test{background:#e8910c}.dot.draft{background:#94a3b8}.dot.paused{background:#6b3fd4}
.cact{display:inline-flex;gap:6px}
.cact button{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;color:#516074;display:inline-flex;align-items:center;justify-content:center}
.cact button:hover{background:#f4f6f9;color:var(--blue)}
.list-empty{text-align:center;color:var(--muted);padding:40px}
@media(max-width:760px){
 .wrap{padding:14px}
 .ctable thead{display:none}
 .ctable,.ctable tbody,.ctable tr,.ctable td{display:block;width:100%}
 .ctable tr{border-bottom:1px solid var(--line);padding:6px 0}
 .ctable td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:6px 14px}
 .ctable td[data-label]:before{content:attr(data-label);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
 .ctable td .cact{margin-left:auto}
}
/* template chooser */
.jrn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
.jrn-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px;text-align:left;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:.15s}
.jrn-card:hover{border-color:var(--blue);box-shadow:var(--shadow-2);transform:translateY(-2px)}
.jrn-blank{align-items:center;justify-content:center;text-align:center;border-style:dashed;min-height:160px}
.jrn-blank-ic{width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--blue);display:flex;align-items:center;justify-content:center}
.jrn-cat{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border:1px solid;border-radius:20px;padding:3px 10px;align-self:flex-start}
.jrn-fd{width:8px;height:8px;border-radius:50%;display:inline-block}
.jrn-title{font-weight:800;font-size:14.5px;color:var(--navy)}
.jrn-desc{font-size:12.5px;color:var(--muted);flex:1}
.jrn-flow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding-top:6px;border-top:1px dashed var(--line)}
.jrn-fc{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#475569;background:#f7f9fc;border:1px solid var(--line);border-radius:20px;padding:3px 8px}
.jrn-far{color:var(--muted-2);display:inline-flex}
.jrn-use{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:700;font-size:12.5px;margin-top:2px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.inp,.sel,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;background:#fff;font-family:inherit;color:var(--ink)}
.inp:focus,.sel:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,114,188,.12)}
.note{display:flex;gap:9px;align-items:flex-start;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.note.info{background:var(--soft);border-color:#cfe0f0}
.pill{display:inline-block;background:#dcfce7;color:#166534;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.pill.warn{background:#fff3e0;color:var(--amber)}
/* ============ BUILDER ============ */
.arc-full{position:fixed;inset:0;top:56px;background:#f0f3f7;display:flex;flex-direction:column;z-index:30}
.arc-top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.arc-jname{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px;color:var(--navy);cursor:pointer;padding:4px 8px;border-radius:8px}
.arc-jname:hover{background:#f4f6f9}
.arc-jname input{font:inherit;font-weight:800;border:1px solid var(--blue);border-radius:6px;padding:2px 6px;max-width:240px}
.arc-top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.arc-body{flex:1;display:flex;min-height:0;position:relative}
.arc-stats{width:290px;flex:0 0 auto;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:14px}
.arc-stats.hide{display:none}
.arc-canvas-wrap{flex:1;position:relative;overflow:auto;min-width:0}
.arc-scroll{width:100%;height:100%;overflow:auto;padding:34px 20px 90px}
.arc-canvas{display:flex;flex-direction:column;align-items:center;min-width:min-content;margin:0 auto;transform-origin:top center}
.arc-node{position:relative;display:flex;align-items:center;gap:11px;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
.arc-node:hover{box-shadow:var(--shadow-2)}
.arc-node.sel{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,114,188,.18)}
.arc-node-empty{border-style:dashed;background:#fbfdff}
.arc-choose{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--blue);background:var(--soft);border:1px solid #cfe0f0;border-radius:20px;padding:4px 11px;flex:0 0 auto}
.arc-bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.arc-ic{width:36px;height:36px;border-radius:9px;background:#f4f6f9;color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.arc-nb{flex:1;min-width:0}
.arc-nt{font-weight:700;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arc-ns{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.arc-dot{border:0;background:transparent;color:var(--muted-2);cursor:pointer;padding:5px;border-radius:6px;flex:0 0 auto}
.arc-dot:hover{background:#f4f6f9;color:var(--ink)}
.arc-conn{display:flex;flex-direction:column;align-items:center}
.arc-line{width:2px;height:16px;background:var(--line)}
.arc-add{width:26px;height:26px;border-radius:50%;border:1px dashed var(--muted-2);background:#fff;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.arc-add:hover{border-color:var(--blue);color:var(--blue);border-style:solid;background:var(--soft)}
.arc-add.sm{width:22px;height:22px}
.arc-end{font-size:11px;color:var(--muted-2);background:#eef1f6;border-radius:20px;padding:3px 12px;font-weight:600}
/* branches */
.arc-branches{display:flex;gap:26px;align-items:flex-start;position:relative;padding-top:14px}
.arc-branches:before{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:var(--line)}
.arc-branch{display:flex;flex-direction:column;align-items:center;position:relative}
.arc-branch:before{content:"";position:absolute;top:-14px;height:14px;width:2px;background:var(--line)}
.arc-pill{font-size:11px;font-weight:700;color:var(--purple);background:#f1e9fb;border:1px solid #e2d4f7;border-radius:20px;padding:3px 12px;margin-bottom:8px;white-space:nowrap}
.arc-pill.a{color:var(--pink);background:#fce4ec;border-color:#f8bbd0}
.arc-pill.nm{color:var(--warn);background:#fff1ec;border-color:#f6c9a6}
/* picker popover */
.arc-picker{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:6px;width:250px;max-height:60vh;overflow:auto}
.arc-picker.hide{display:none}
.arc-pk-hd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:8px 10px 6px}
.arc-pk-grp{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border:0;background:transparent;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--ink);text-align:left}
.arc-pk-grp:hover{background:#f4f6f9}
.arc-pk-grp .arc-pk-lb{flex:1}
.arc-pk-ic{width:30px;height:30px;border-radius:8px;background:#f4f6f9;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.arc-pk-sub{display:none;padding:2px 0 4px 10px;margin-left:14px;border-left:2px solid var(--line2)}
.arc-pk-item.open .arc-pk-sub{display:block}
.arc-pk-item.open .arc-pk-grp .chev{transform:rotate(90deg)}
.arc-pk-leaf{width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink-2)}
.arc-pk-leaf:hover{background:var(--soft);color:var(--blue)}
/* zoom */
.arc-zoom{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
.arc-zb{border:0;background:transparent;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.arc-zb:hover{background:#f4f6f9;color:var(--ink)}
.arc-zv{font-size:12px;font-weight:700;color:var(--ink-2);width:44px;text-align:center}
/* node config drawer */
.arc-drawer{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:92vw;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(16,36,60,.10);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease;z-index:20}
.arc-drawer.open{transform:none}
/* full-page node setup */
.np-overlay{position:fixed;inset:0;top:56px;background:var(--bg);z-index:46;display:flex;flex-direction:column}
.np-top{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.np-ic{width:34px;height:34px;border-radius:9px;background:#f4f6f9;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.np-title{font-size:15px;font-weight:800;color:var(--navy);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-body{flex:1;display:flex;min-height:0;padding:0}
.np-main{flex:1;overflow:auto;padding:24px 28px;min-width:0}
.np-main .np-form{max-width:860px;margin:0 auto}
.np-main .arc-dw-body{overflow:visible;padding:0}
.np-side{width:344px;flex:0 0 auto;border-left:1px solid var(--line);background:#fff;overflow:auto;padding:18px 18px 24px}
.np-side-hd{font-size:12px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;margin-bottom:12px;display:flex;gap:7px;align-items:center}
.apv-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line2);font-size:12.5px}
.apv-row:first-child{border-top:0}
.apv-k{color:var(--muted);font-weight:600;flex:0 0 auto}
.apv-v{color:var(--ink);text-align:right;min-width:0;word-break:break-word}
@media(max-width:860px){.np-body{flex-direction:column}.np-main{padding:16px}.np-side{width:100%;border-left:0;border-top:1px solid var(--line)}}
/* node preview popover */
.arc-preview{position:fixed;z-index:72;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:12px;width:264px;max-height:60vh;overflow:auto}
.arc-preview.hide{display:none}
.apv-hd{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:8px}
.apv-ic{width:28px;height:28px;border-radius:7px;background:#f4f6f9;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
/* segmentation / condition builder (3 nhóm: Events / Attributes / Saved) */
.sc-grp{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:10px;overflow:hidden}
.sc-grp-hd{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#f7f9fc;border-bottom:1px solid var(--line)}
.sc-grp-hd b{font-size:12.5px;color:var(--navy);flex:1;min-width:0}
.sc-logic{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sc-logic button{border:0;background:#fff;font:inherit;font-size:11px;font-weight:700;color:var(--muted);padding:4px 9px;cursor:pointer}
.sc-logic button.on{background:var(--blue);color:#fff}
.sc-grp-body{padding:10px 11px}
.sc-row{display:grid;grid-template-columns:1fr 150px 1fr 32px;gap:8px;align-items:center;margin-bottom:8px}
.sc-row .sel,.sc-row .inp{padding:7px 9px;font-size:12.5px;min-width:0}
.sc-conn{font-size:10.5px;font-weight:800;color:var(--blue);letter-spacing:.03em;margin:0 0 8px 2px}
.sc-x{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.sc-x:hover{color:var(--warn);border-color:#f6c9a6;background:#fff1ec}
.sc-grp-sep{text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);margin:2px 0 10px}
.sc-addmenu{position:relative;display:flex;justify-content:center;margin-top:4px}
.sc-menu{position:absolute;top:100%;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-2);padding:5px;z-index:5;width:230px}
.sc-menu.hide{display:none}
.sc-menu button{width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink)}
.sc-menu button:hover{background:var(--soft);color:var(--blue)}
@media(max-width:760px){.sc-row{grid-template-columns:1fr;gap:6px;padding:10px;border:1px solid var(--line);border-radius:9px}.sc-row .sc-x{width:100%}}
.arc-dw-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.arc-dw-title{font-weight:800;font-size:14px;color:var(--navy);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arc-dw-body{flex:1;overflow:auto;padding:16px}
.arc-sec{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 9px}
.arc-sec:first-child{margin-top:0}
.arc-dw-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.radio-row{display:flex;flex-direction:column;gap:8px}
.radio-row label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* event params + condition/ab paths + seg tabs */
.ev-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ev-row .ev-and{font-size:10px;font-weight:800;color:var(--muted);background:#eef1f6;border-radius:5px;padding:4px 6px;flex:0 0 auto}
.ev-row .sel,.ev-row .inp{padding:7px 8px;font-size:12.5px;min-width:0}
.ev-x{border:1px solid var(--line);background:#fff;border-radius:7px;width:28px;height:28px;flex:0 0 auto;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.ev-x:hover{color:var(--warn);border-color:#f6c9a6;background:#fff1ec}
.path-row{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;background:#fbfdff}
.path-row.nm{background:#fff6ef;border-color:#f6d3bd}
.path-row .field:last-child{margin-bottom:0}
.path-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.path-head .inp{flex:1;min-width:0}
.path-badge{width:24px;height:24px;border-radius:7px;background:var(--purple);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.path-badge.a{background:var(--pink)}
.path-badge.nm{background:var(--warn)}
.seg-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.seg-tab{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font-size:11.5px;font-weight:600;color:#516074;cursor:pointer;font-family:inherit}
.seg-tab.on{border-color:var(--blue);background:var(--soft);color:var(--blue)}
/* live stats */
.st-hd{font-size:12px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.st-kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.st-tile{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fbfdff}
.st-tile .v{font-size:20px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.st-tile .l{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
.st-node{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line2)}
.st-node .si{width:28px;height:28px;border-radius:7px;background:#f4f6f9;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.st-node .sb{flex:1;min-width:0}
.st-node .snt{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-bar{height:6px;border-radius:4px;background:#eef1f6;overflow:hidden;margin-top:4px}
.st-fill{height:100%;background:linear-gradient(90deg,#0072bc,#00a1e0)}
.st-num{font-size:12px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:0 0 auto}
/* launch overlay wizard */
.lc-overlay{position:fixed;inset:0;top:56px;background:#f4f6f9;z-index:50;display:flex;flex-direction:column}
.lc-top{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px}
.lc-body{flex:1;overflow:auto;padding:22px}
.lc-inner{max-width:820px;margin:0 auto}
.lc-steps{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:18px;box-shadow:var(--shadow)}
.lc-step{flex:1;display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;cursor:pointer}
.lc-step.on{background:var(--soft)}
.lc-step .num{width:24px;height:24px;border-radius:50%;background:#eef1f6;color:var(--muted);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.lc-step.on .num{background:var(--blue);color:#fff}
.lc-step.done .num{background:var(--green);color:#fff}
.lc-step small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.lc-step b{font-size:13px;color:var(--ink)}
.lc-foot{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.sum-grid{display:grid;grid-template-columns:190px 1fr;row-gap:11px;column-gap:16px;align-items:baseline}
.sum-grid .k{color:var(--muted);font-weight:600;font-size:13px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.chk .ci{flex:0 0 auto;margin-top:1px}
.chk .ok{color:var(--green)}.chk .bad{color:var(--warn)}
.arc-menu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-2);padding:5px;width:162px}
.arc-menu.hide{display:none}
.arc-menu button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink);text-align:left}
.arc-menu button:hover{background:#f4f6f9}
.arc-menu button.danger{color:var(--warn)}
.arc-menu button.danger:hover{background:#fff1ec}
@media(max-width:820px){.arc-stats{position:absolute;z-index:22;height:100%;box-shadow:var(--shadow-2)}.lc-steps{flex-wrap:wrap}.lc-step{flex:1 1 45%}.arc-drawer{width:100%}}
</style>

function entryLabel(e){return e==='segment'?'Segment (phân khúc)':e==='attribute'?'Attribute (thuộc tính)':e==='leadscore'?'Lead Score (ngưỡng điểm)':'On Event (sự kiện)';}
function entrySub(nd,sm){
  sm=sm||starterMeta(nd.starter);var k=sm.k,s;
  if(k==='on_event'||k==='website_action'||k==='business_event')s=(k==='business_event'?'Business Event: ':(k==='website_action'?'Website: ':'Sự kiện: '))+(nd.event||'—');
  else if(k==='attr_change')s=(nd.attr||'attr')+' '+(nd.attrOp||'thay đổi')+(nd.attrVal?(' '+nd.attrVal):'');
  else if(k==='past_behaviour')s=nd.past||'Điều kiện quá khứ';
  else if(k==='dynamic_date')s=(nd.dateWhen||'Trước')+' '+(nd.dateN==null?3:nd.dateN)+' ngày · '+(nd.dateSrc||'Ngày khai giảng');
  else s=(nd.prod||'Sản phẩm')+' · '+sm.label;
  if(nd.addSeg&&nd.addSeg.indexOf('Không lọc')<0)s+=' · '+nd.addSeg;
  if(segCondCount(nd))s+=' · +'+segCondCount(nd)+' lọc';
  return s;
}
function waitTitle(nd){return {some_time:'Chờ một khoảng thời gian',time_slot:'Chờ đến khung giờ',event:'Chờ sự kiện',attribute:'Chờ theo thuộc tính',dynamic_time:'Chờ đến thời điểm động'}[nd.wk]||nd.title;}
function waitSub(nd){
  if(nd.wk==='event')return 'Chờ: '+(nd.evt||'sự kiện')+' · timeout '+(nd.toN||30)+' '+(nd.toU||'phút')+' → '+(nd.toAct==='drop'?'rời journey':'đi tiếp');
  if(nd.wk==='time_slot')return 'Chờ đến khung '+(nd.slotFrom||'08:00')+'–'+(nd.slotTo||'20:00');
  if(nd.wk==='attribute')return nd.waitAttr||'Chờ theo thuộc tính';
  if(nd.wk==='dynamic_time')return nd.dyn||'Thời điểm động';
  return 'Chờ '+(nd.days||1)+' '+(nd.unit||'ngày')+(nd.mode==='dynamic'?' (động)':'');
}
function checkSub(nd){
  var isCond=chkTitleOf(nd)==='Check Conditions';
  if(isCond)return 'Rẽ '+nd.branches.filter(function(b){return !b.nm;}).length+' nhánh + Not Matching';
  return nd.cond||chkTitleOf(nd);
}
function abSub(nd){var s=nd.branches.length+' path';if(+nd.ctrlPct)s+=' · control '+nd.ctrlPct+'%';if(nd.winner)s+=' · winner';return s;}
function syncNode(id){
  var f=findNode(id);if(!f)return;var nd=f.node;
  var g=function(x){var e=document.getElementById(x);return e?e.value:null;};
  var rows=function(s){return [].slice.call(document.querySelectorAll('.arc-dw-body '+s));};
  if(g('dwName'))nd.title=g('dwName');
  if(nd.type==='entry'){
    if(g('dwStarter'))nd.starter=g('dwStarter');
    if(g('dwEvent')!=null)nd.event=g('dwEvent');
    if(g('dwAttr')!=null)nd.attr=g('dwAttr');if(g('dwAttrOp')!=null)nd.attrOp=g('dwAttrOp');if(g('dwAttrVal')!=null)nd.attrVal=g('dwAttrVal');
    if(g('dwPast')!=null)nd.past=g('dwPast');
    if(g('dwDate')!=null)nd.dateSrc=g('dwDate');if(g('dwDateWhen')!=null)nd.dateWhen=g('dwDateWhen');if(g('dwDateN')!=null)nd.dateN=+g('dwDateN');
    if(g('dwProd')!=null)nd.prod=g('dwProd');
    if(g('dwSeg')!=null)nd.addSeg=g('dwSeg');
    if(rows('[data-ep="p"]').length){var eps=[];rows('[data-ep="p"]').forEach(function(el){var i=+el.getAttribute('data-i');eps[i]=eps[i]||{};eps[i].field=el.value;});rows('[data-ep="o"]').forEach(function(el){var i=+el.getAttribute('data-i');eps[i]=eps[i]||{};eps[i].op=el.value;});rows('[data-ep="v"]').forEach(function(el){var i=+el.getAttribute('data-i');eps[i]=eps[i]||{};eps[i].val=el.value;});nd.evParams=eps.filter(Boolean);}
    var grps=rows('.sc-grp');
    if(grps.length&&nd.segCond){grps.forEach(function(gEl,gi){if(!nd.segCond[gi])return;[].slice.call(gEl.querySelectorAll('.sc-row')).forEach(function(rEl,ri){if(!nd.segCond[gi].rows[ri])return;var fs=rEl.querySelector('[data-sc="f"]'),os=rEl.querySelector('[data-sc="o"]'),vs=rEl.querySelector('[data-sc="v"]');if(fs)nd.segCond[gi].rows[ri].f=+fs.value;if(os)nd.segCond[gi].rows[ri].o=+os.value;if(vs)nd.segCond[gi].rows[ri].v=vs.value;});});}
    nd.sub=entrySub(nd);
  } else if(nd.type==='wait'){
    if(g('dwWaitKind'))nd.wk=g('dwWaitKind');
    var wm=document.querySelector('.arc-dw-body input[name="wmode"]:checked');if(wm)nd.mode=wm.value;
    if(g('dwWaitN')!=null)nd.days=+g('dwWaitN');if(g('dwWaitU')!=null)nd.unit=g('dwWaitU');
    if(g('dwWaitEvt')!=null)nd.evt=g('dwWaitEvt');
    if(g('dwToN')!=null)nd.toN=+g('dwToN');if(g('dwToU')!=null)nd.toU=g('dwToU');if(g('dwToAct')!=null)nd.toAct=(g('dwToAct')==='Rời khỏi journey'?'drop':'proceed');
    if(g('dwSlotFrom')!=null)nd.slotFrom=g('dwSlotFrom');if(g('dwSlotTo')!=null)nd.slotTo=g('dwSlotTo');
    if(g('dwWaitAttr')!=null)nd.waitAttr=g('dwWaitAttr');
    if(g('dwDyn')!=null)nd.dyn=g('dwDyn');
    nd.sub=waitSub(nd);
  } else if(nd.type==='check'){
    if(g('dwCheck'))nd.checkType=g('dwCheck');
    if(g('dwCheckCond')!=null)nd.cond=g('dwCheckCond');
    rows('[data-cp="lb"]').forEach(function(el){var i=+el.getAttribute('data-i');if(nd.branches[i])nd.branches[i].label=el.value;});
    rows('[data-cp="seg"]').forEach(function(el){var i=+el.getAttribute('data-i');if(nd.branches[i])nd.branches[i].seg=el.value;});
    nd.sub=checkSub(nd);
  } else if(nd.type==='ab'){
    rows('[data-ab="nm"]').forEach(function(el){var i=+el.getAttribute('data-i');if(nd.branches[i])nd.branches[i].label=el.value;});
    rows('[data-ab="pct"]').forEach(function(el){var i=+el.getAttribute('data-i');if(nd.branches[i])nd.branches[i].pct=+el.value||0;});
    if(g('dwCtrl')!=null)nd.ctrlPct=+g('dwCtrl')||0;
    var re=document.getElementById('dwReel');if(re)nd.reEligSame=re.checked;
    var wn=document.getElementById('dwWinner');if(wn)nd.winner=wn.checked;
    nd.sub=abSub(nd);
  } else if(nd.type==='channel'){nd.sub='Gửi qua '+nd.ch;}
  else if(nd.type==='action'){var at=g('dwAct');if(at)nd.actKind=at;if(g('dwActTarget')!=null)nd.target=g('dwActTarget');nd.sub=nd.target||'Hành động trong journey';}
  else if(nd.type==='nbc'){if(g('dwNbcWin')!=null)nd.win=g('dwNbcWin');}
}
window.saveNode=function(id){syncNode(id);reRenderCanvas();closeDrawer();toast('Đã lưu cấu hình bước');};
/* onchange handlers that re-layout the drawer (preserve name only, avoid field mismatch) */
function keepName(id){var f=findNode(id);var nm=document.getElementById('dwName');if(f&&nm)f.node.title=nm.value;return f;}
window.onStarterChange=function(id,v){var f=keepName(id);if(!f)return;f.node.starter=v;f.node.sub=entrySub(f.node);openDrawer(id);reRenderCanvas();};
window.onWaitKind=function(id,v){var f=keepName(id);if(!f)return;f.node.wk=v;f.node.title=waitTitle(f.node);f.node.sub=waitSub(f.node);openDrawer(id);reRenderCanvas();};
window.onCheckType=function(id,v){var f=keepName(id);if(!f)return;f.node.checkType=v;f.node.sub=checkSub(f.node);openDrawer(id);reRenderCanvas();};
window.segTab=function(id,t){syncNode(id);var f=findNode(id);if(!f)return;f.node.segTab=t;openDrawer(id);};
window.addEventParam=function(id){syncNode(id);var f=findNode(id);if(!f)return;f.node.evParams=f.node.evParams||[];f.node.evParams.push({field:EVENT_PARAMS[0],op:PARAM_OPS[0],val:''});openDrawer(id);};
window.delEventParam=function(id,i){syncNode(id);var f=findNode(id);if(!f)return;(f.node.evParams||[]).splice(i,1);openDrawer(id);};
window.addCondPath=function(id){syncNode(id);var f=findNode(id);if(!f)return;var b=f.node.branches;var nmIdx=-1;b.forEach(function(x,ix){if(x.nm)nmIdx=ix;});var np={label:'Điều kiện '+(b.filter(function(x){return !x.nm;}).length+1),seg:'',nodes:[]};if(nmIdx<0)b.push(np);else b.splice(nmIdx,0,np);f.node.sub=checkSub(f.node);openDrawer(id);reRenderCanvas();};
window.delCondPath=function(id,i){syncNode(id);var f=findNode(id);if(!f)return;if(f.node.branches.filter(function(x){return !x.nm;}).length<=1){toast('Cần ít nhất 1 nhánh điều kiện');return;}f.node.branches.splice(i,1);f.node.sub=checkSub(f.node);openDrawer(id);reRenderCanvas();};
window.addABPath=function(id){syncNode(id);var f=findNode(id);if(!f)return;var n=f.node.branches.length;f.node.branches.push({label:'Path '+String.fromCharCode(65+n),pct:0,nodes:[]});f.node.sub=abSub(f.node);openDrawer(id);reRenderCanvas();};
window.delABPath=function(id,i){syncNode(id);var f=findNode(id);if(!f)return;if(f.node.branches.length<=2){toast('A/B cần ít nhất 2 path');return;}f.node.branches.splice(i,1);f.node.sub=abSub(f.node);openDrawer(id);reRenderCanvas();};
window.distributeAB=function(id){syncNode(id);var f=findNode(id);if(!f)return;var n=f.node.branches.length,each=Math.floor(100/n);f.node.branches.forEach(function(b,i){b.pct=(i===n-1)?(100-each*(n-1)):each;});f.node.ctrlPct=0;f.node.sub=abSub(f.node);openDrawer(id);reRenderCanvas();};

  var flat=flatten(window.cur.nodes),base=j.status==='Live'?12480:640;
  var tiles=[['Đang chạy',fmt(Math.round(base*0.34))],['Hoàn tất',fmt(Math.round(base*0.5))],['Chuyển đổi',(j.conv&&j.conv!=='—')?j.conv:'9,4%'],['Đã thoát',fmt(Math.round(base*0.08))]];
  var h='<div class="st-hd">'+icon('chart',15)+' Live Statistics <span class="badge '+statusKey(j.status)+'" style="margin-left:auto">'+statusLabel(j.status)+'</span></div>';
  h+='<div class="st-kpis">'+tiles.map(function(t){return '<div class="st-tile"><div class="v">'+t[1]+'</div><div class="l">'+t[0]+'</div></div>';}).join('')+'</div>';
  h+='<div class="st-hd" style="font-size:11px">Funnel theo bước</div>';
  var cur=base;
  flat.forEach(function(nd){var m=NODE_META[nd.type]||NODE_META.action;var col=nd.type==='channel'?'var(--blue)':m.color;var reach=Math.max(20,Math.round(cur));var pct=Math.max(4,Math.round(reach/base*100));cur=cur*(nd.type==='wait'?0.94:nd.type==='check'?0.6:0.82);h+='<div class="st-node"><span class="si" style="color:'+col+'">'+icon(nd.type==='channel'?chIcon(nd.ch):m.icon,15)+'</span><div class="sb"><div class="snt">'+esc(nd.title)+'</div><div class="st-bar"><div class="st-fill" style="width:'+pct+'%"></div></div></div><span class="st-num">'+fmt(reach)+'</span></div>';});
  return h;
}
function updateStats(){var s=document.getElementById('arcStats');if(s&&!s.classList.contains('hide'))s.innerHTML=statsHTML();}

/* ---- launch wizard ---- */
window.openLaunch=function(){if(window._readonly)return;window._lcStep=0;renderLaunch();};
window.closeLaunch=function(){document.getElementById('modalRoot').innerHTML='';};
window.lcGo=function(d){var n=window._lcStep+d;if(n<0){closeLaunch();return;}if(n>3)return;window._lcStep=n;renderLaunch();};
window.lcStepTo=function(i){window._lcStep=i;renderLaunch();};
function renderLaunch(){document.getElementById('modalRoot').innerHTML=launchHTML();}
function launchHTML(){
  var s=window._lcStep,j=window.cur;
  var steps=[['Exit Criteria','Điều kiện thoát'],['Journey Goals','Mục tiêu'],['Launch Settings','Cài đặt chạy'],['Review & Launch','Kiểm tra & bật']];
  var nav='<div class="lc-steps">'+steps.map(function(st,i){return '<div class="lc-step'+(i===s?' on':'')+(i<s?' done':'')+'" onclick="lcStepTo('+i+')"><span class="num">'+(i<s?'✓':(i+1))+'</span><span><small>Bước '+(i+1)+'</small><b>'+st[0]+'</b></span></div>';}).join('')+'</div>';
  var body=[lcExit,lcGoals,lcSettings,lcReview][s]();
  var last=(s===3);
  var foot='<div class="lc-foot"><button class="btn ghost" onclick="lcGo(-1)">'+icon('back',15)+' '+(s===0?'Huỷ':'Quay lại')+'</button>'+
    (last?'<div class="row" style="gap:8px"><button class="btn ghost" onclick="lcLaunch(\'Test\')">'+icon('play',15)+' Chạy Test</button><button class="btn pub" onclick="lcLaunch(\'Live\')">'+icon('rocket',16)+' Kích hoạt (Live)</button></div>'
          :'<button class="btn pri" onclick="lcGo(1)">Tiếp tục '+icon('right',15)+'</button>')+'</div>';
  return '<div class="lc-overlay"><div class="lc-top"><button class="btn ghost sm" onclick="closeLaunch()">'+icon('close',15)+' Đóng</button><b style="font-size:15px">Launch journey · '+esc(j.name)+'</b><span class="badge '+statusKey(j.status)+'" style="margin-left:auto"><span class="dot '+statusKey(j.status)+'"></span> '+statusLabel(j.status)+'</span></div>'+
    '<div class="lc-body"><div class="lc-inner">'+nav+body+foot+'</div></div></div>';
}
function lcExit(){var e=window.cur.exit;
  return '<div class="card"><h3 style="margin-bottom:4px">Exit Criteria — Điều kiện thoát journey</h3><div class="muted" style="margin-bottom:14px">Người dùng rời journey ngay khi thoả một trong các điều kiện dưới đây (không nhận các bước còn lại).</div>'+
   '<label class="row" style="gap:9px;margin-bottom:12px;font-size:13.5px"><input type="checkbox" id="exGoal" '+(e.onGoal?'checked':'')+'> <b>Thoát khi đạt mục tiêu chuyển đổi</b> — dừng ngay khi user hoàn thành Goal (khuyến nghị).</label>'+
   '<label class="row" style="gap:9px;margin-bottom:12px;font-size:13.5px"><input type="checkbox" id="exSeg" '+(e.onSeg?'checked':'')+'> Thoát khi khớp phân khúc loại trừ</label>'+
   '<div class="field" style="max-width:420px"><label>Phân khúc loại trừ</label><select class="sel" id="exSegSel">'+selOpts(['— Không —','Đã huỷ đăng ký','Đã chuyển đổi','Khách đã nhập học'],'— Không —')+'</select></div>'+
   '<label class="row" style="gap:9px;margin:6px 0 12px;font-size:13.5px"><input type="checkbox" id="exMax" checked> Thoát sau tối đa <input class="inp" type="number" id="exMaxN" value="'+(e.maxDays||30)+'" style="width:80px;display:inline-block;margin:0 6px"> ngày trong journey</label>'+
   '</div>';
}
function lcGoals(){var g=window.cur.goals;
  return '<div class="card"><h3 style="margin-bottom:4px">Journey Goals — Mục tiêu &amp; quy đổi</h3><div class="muted" style="margin-bottom:14px">Xác định mục tiêu để đo Conversion và (tuỳ chọn) để thoát khi đạt.</div>'+
   fg('Mục tiêu chính (Primary goal)','<select class="sel" id="goPrimary">'+selOpts(['Đã đặt cọc','Đã nộp hồ sơ','Đã nhập học','Đã đăng ký tư vấn','Đã bấm link'],g.primary)+'</select>')+
   '<div class="mini-grid" style="max-width:520px">'+fg('Cửa sổ quy đổi (attribution)','<select class="sel" id="goWin">'+selOpts(['1 ngày','3 ngày','7 ngày','14 ngày','30 ngày'],(g.window||14)+' ngày')+'</select>')+fg('Mục tiêu phụ (tuỳ chọn)','<select class="sel" id="goSec">'+selOpts(['— Không —','Mở email','Truy cập landing page','Tương tác Zalo'],'— Không —')+'</select>')+'</div>'+
   '<div class="note info">'+icon('target',14)+'<span>Conversion của journey = % người đạt <b>mục tiêu chính</b> trong cửa sổ quy đổi kể từ khi vào journey.</span></div></div>';
}
function lcSettings(){var s=window.cur.settings,today=new Date().toISOString().slice(0,10);
  return '<div class="card"><h3 style="margin-bottom:4px">Launch Settings — Cài đặt chạy</h3><div class="muted" style="margin-bottom:14px">Quy tắc vào lại, tần suất, lịch chạy và khung giờ yên tĩnh.</div>'+
   '<div class="arc-sec">Re-entry (vào lại)</div><div class="radio-row" style="margin-bottom:6px">'+
     '<label><input type="radio" name="reentry" value="once" '+(s.reentry==='once'?'checked':'')+'> Mỗi người chỉ vào <b>một lần</b></label>'+
     '<label><input type="radio" name="reentry" value="always" '+(s.reentry==='always'?'checked':'')+'> Cho vào lại bất cứ khi nào thoả entry</label>'+
     '<label><input type="radio" name="reentry" value="after" '+(s.reentry==='after'?'checked':'')+'> Cho vào lại sau <input class="inp" type="number" value="7" style="width:70px;display:inline-block;margin:0 6px"> ngày</label>'+
   '</div>'+
   '<div class="mini-grid" style="max-width:520px">'+fg('Giới hạn tần suất (tin/người/ngày)','<input class="inp" type="number" id="setCap" value="'+(s.cap||2)+'" min="1">')+fg('Lịch chạy — bắt đầu','<input class="inp" type="date" id="setStart" value="'+today+'">')+'</div>'+
   '<div class="mini-grid" style="max-width:520px">'+fg('Kết thúc (để trống = chạy liên tục)','<input class="inp" type="date" id="setEnd">')+fg('Frequency capping','<select class="sel">'+selOpts(['Theo cấu hình toàn hệ thống','Tối đa 3 tin/tuần','Tối đa 5 tin/tuần'],'Theo cấu hình toàn hệ thống')+'</select>')+'</div>'+
   '<div class="arc-sec">Quiet hours (không gửi trong khung giờ)</div><div class="mini-grid" style="max-width:360px">'+fg('Từ','<input class="inp" type="time" value="'+(s.qFrom||'21:00')+'" step="900">')+fg('Đến','<input class="inp" type="time" value="'+(s.qTo||'07:00')+'" step="900">')+'</div></div>';
}
function lcReview(){var j=window.cur,flat=flatten(j.nodes);
  var chCount=flat.filter(function(x){return x.type==='channel';}).length;
  var hasEntry=j.nodes[0]&&j.nodes[0].type==='entry';
  var emptyBranch=false;flat.forEach(function(x){if(x.branches)x.branches.forEach(function(b){if(!b.nm&&!b.nodes.length)emptyBranch=true;});});
  var checks=[
   [hasEntry,'Đã cấu hình bước Bắt đầu (Entry)'],
   [chCount>0,'Có ít nhất một bước Kênh gửi ('+chCount+' bước)'],
   [!emptyBranch,'Không có nhánh Check/Split bị bỏ trống'],
   [!!(window.cur.goals&&window.cur.goals.primary),'Đã đặt Mục tiêu chuyển đổi: '+(window.cur.goals.primary||'—')]
  ];
  var allOk=checks.every(function(c){return c[0];});
  var g=window.cur.goals,s=window.cur.settings;
  var reentryLbl={once:'Một lần/người',always:'Cho vào lại',after:'Vào lại sau N ngày'}[s.reentry]||'Một lần/người';
  return '<div class="card"><h3 style="margin-bottom:4px">Review &amp; Launch</h3><div class="muted" style="margin-bottom:14px">Kiểm tra nhanh trước khi bật journey.</div>'+
   '<div class="arc-sec">Kiểm tra hợp lệ</div>'+checks.map(function(c){return '<div class="chk"><span class="ci '+(c[0]?'ok':'bad')+'">'+icon(c[0]?'check':'info',16)+'</span><span>'+c[1]+'</span></div>';}).join('')+
   '<div class="arc-sec">Tóm tắt cấu hình</div><div class="sum-grid">'+
     '<div class="k">Số bước</div><div>'+countSteps()+' bước</div>'+
     '<div class="k">Mục tiêu</div><div>'+esc(g.primary)+' · cửa sổ '+(g.window||14)+' ngày</div>'+
     '<div class="k">Exit</div><div>'+(window.cur.exit.onGoal?'Thoát khi đạt mục tiêu; ':'')+'tối đa '+(window.cur.exit.maxDays||30)+' ngày</div>'+
     '<div class="k">Re-entry</div><div>'+reentryLbl+' · tối đa '+(s.cap||2)+' tin/người/ngày</div>'+
     '<div class="k">Quiet hours</div><div>'+(s.qFrom||'21:00')+'–'+(s.qTo||'07:00')+'</div>'+
   '</div>'+
   (allOk?'<div class="note info" style="margin-top:14px">'+icon('check',15)+'<span>Journey hợp lệ — có thể <b>Chạy Test</b> (một phần đối tượng) hoặc <b>Kích hoạt Live</b> cho toàn bộ.</span></div>'
         :'<div class="note" style="margin-top:14px;border-color:#f6c9a6;background:#fff6ef;color:var(--warn)">'+icon('info',15)+'<span>Còn mục chưa đạt — nên hoàn thiện trước khi kích hoạt Live (vẫn có thể chạy Test).</span></div>')+
   '</div>';
}
window.lcLaunch=function(mode){
  var j=window.cur;j.status=mode;j.conv=(mode==='Live'?(j.conv&&j.conv!=='—'?j.conv:'—'):j.conv);
  // upsert into list
  var rec={id:j.id||window.jseq++,name:j.name,status:mode,entry:(j.nodes[0]&&j.nodes[0].sub)||'—',steps:countSteps(),conv:(j.conv&&j.conv!=='—')?j.conv:'—',version:j.version,tpl:(window.journeys.find(function(x){return x.id===j.id;})||{}).tpl||'blank'};
  var ex=window.journeys.find(function(x){return x.id===rec.id;});
  if(ex){Object.assign(ex,rec);}else{j.id=rec.id;window.journeys.unshift(rec);}
  window._editingId=rec.id;
  closeLaunch();
  window._readonly=false;window._statsOpen=true;renderApp();
  toast(mode==='Live'?'Đã kích hoạt journey (Live) ✓ — vẫn có thể sửa & cập nhật':'Journey đang chạy Test ✓ — xem Live Statistics bên trái');
};

/* ============ RENDER APP ============ */
window.renderApp=function(){
  var app=document.getElementById('app');
  if(window.view==='list'){app.innerHTML='<div class="wrap">'+listHTML()+'</div>';}
  else if(window.view==='chooser'){app.innerHTML='<div class="wrap">'+chooserHTML()+'</div>';}
  else if(window.view==='report'){app.innerHTML='<div class="wrap">'+reportHTML()+'</div>';}
  else{app.innerHTML=builderHTML();}
  window.scrollTo(0,0);
};
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('logoMk').innerHTML=icon('logo',18);
  document.getElementById('searchIc').innerHTML=icon('search',15);
  var qb=document.getElementById('quickBtn');qb.innerHTML=icon('plus',15)+' Tạo Journey';qb.onclick=function(){openChooser();};
  try{renderApp();}catch(e){console.error(e);}
});
document.addEventListener('click',function(e){
  if(!(e.target.closest&&(e.target.closest('#arcPicker')||e.target.closest('[onclick*="addAfter"]')||e.target.closest('[onclick*="addToBranch"]')||e.target.closest('[onclick*="openStarterPick"]'))))closePicker();
  if(!(e.target.closest&&(e.target.closest('#arcMenu')||e.target.closest('[onclick*="nodeMenu"]'))))closeMenu();
  if(!(e.target.closest&&(e.target.closest('#arcPreview')||e.target.closest('[onclick*="nodePreview"]'))))closePreview();
  var scm=document.getElementById('scMenu');if(scm&&!scm.classList.contains('hide')&&!(e.target.closest&&(e.target.closest('#scMenu')||e.target.closest('[onclick*="scToggleMenu"]'))))scm.classList.add('hide');
});
</script>
